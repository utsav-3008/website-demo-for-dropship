<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DropShipX</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1 class="logo">DropShipX</h1>
    <input type="text" placeholder="Search products..." class="search" />
    <div class="actions">
      <span>👤</span>
      <span>🛒</span>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="container">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <h3>Categories</h3>
      <ul>
        <li>Electronics</li>
        <li>Home & Kitchen</li>
        <li>Fitness</li>
        <li>Fashion</li>
        <li>Accessories</li>
      </ul>
    </aside>

    <!-- Products -->
    <main class="products" id="product-list">
      <!-- Products injected by JS -->
    </main>

  </div>

  <!-- Footer -->
  <footer class="footer">
    © 2026 DropShipX · Privacy · Terms
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
